<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoBlogWrite</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--mute:#6b7280;--line:#e3e6eb;--pri:#03c75a;--pri-d:#02a84b;--bad:#d93025;--warn:#b26a00}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--fg:#e6e9ef;--mute:#9aa3b2;--line:#2c323c;--bad:#ff6b60;--warn:#e0a040}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Malgun Gothic",sans-serif}
header{display:flex;gap:4px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
header b{margin-right:12px}nav button{background:none;border:0;padding:8px 12px;border-radius:6px;color:var(--mute);cursor:pointer;font:inherit}
nav button.on{background:var(--pri);color:#fff}main{max-width:1000px;margin:16px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{text-align:center}.stat b{font-size:26px;display:block}
input,textarea,select,button.b{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
textarea{width:100%;min-height:340px;font-family:ui-monospace,monospace;font-size:13px}input[type=text]{width:100%}
button.b{cursor:pointer;background:var(--pri);color:#fff;border-color:var(--pri);margin:2px}button.b:hover{background:var(--pri-d)}
button.b.g{background:var(--bg);color:var(--fg);border-color:var(--line)}button.b.r{background:var(--bad);border-color:var(--bad)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--line);font-size:12px}.err{color:var(--bad)}.mute{color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.row>input[type=text]{flex:1;min-width:160px}
#msg{position:fixed;bottom:16px;right:16px;max-width:380px;padding:10px 14px;border-radius:8px;background:var(--fg);color:var(--bg);display:none}
label.opt{display:block;padding:4px 0;cursor:pointer}iframe{width:100%;height:480px;border:1px solid var(--line);border-radius:6px;background:#fff}
</style></head><body>
<header><b>✍️ AutoBlogWrite</b><nav id="nav"></nav></header>
<main id="main"></main><div id="msg"></div>
<script>
const ST={draft:'작성 중',reviewed:'검수 완료',scheduled:'예약 발행',published:'발행 완료',failed:'발행 실패',pending:'미사용',drafted:'작성 예정',done:'발행 완료',skipped:'건너뜀'};
const TABS=[['dash','대시보드'],['topics','키워드'],['articles','글 관리'],['sched','예약 발행'],['posts','발행 이력']];
let tab='dash',cur=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t,bad){const m=$('#msg');m.textContent=t;m.style.background=bad?'var(--bad)':'';m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',4000)}
async function api(method,url,body){
  const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j}
async function act(fn,ok){try{const r=await fn();if(ok)toast(ok);return r}catch(e){toast(e.message,true)}}
function nav(){$('#nav').innerHTML=TABS.map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${v}</button>`).join('')}
function go(t,arg){tab=t;cur=arg??null;nav();({dash,topics,articles,sched:schedList,posts,editor,wizard})[t]()}
const stat=(n,l)=>`<div class="card stat"><b>${n??0}</b><span class="mute">${l}</span></div>`;

async function dash(){const d=await api('GET','/api/dashboard'),a=d.articles_by_status;
 $('#main').innerHTML=`<div class="grid">${stat(d.articles_total,'전체 글')}${stat(a.draft,'작성 중')}${stat(a.reviewed,'검수 완료')}${stat(a.scheduled,'예약 발행')}${stat(a.published,'발행 완료')}${stat(a.failed,'발행 실패')}${stat(d.published_today,'오늘 발행')}${stat(d.published_month,'이번 달 발행')}</div>
 <div class="card"><b>예약 일정</b><table>${d.upcoming.map(x=>`<tr><td>${esc(x.scheduled_at.replace('T',' '))}</td><td>${esc(x.title)}</td></tr>`).join('')||'<tr><td class="mute">없음</td></tr>'}</table></div>
 <div class="card"><b>최근 작성 글</b><table>${d.recent_articles.map(x=>`<tr><td><a href="#" onclick="go('editor',${x.id});return false">${esc(x.title)}</a></td><td><span class="tag">${ST[x.status]}</span></td></tr>`).join('')||'<tr><td class="mute">없음</td></tr>'}</table></div>
 <div class="card"><b>키워드 사용 현황</b> ${Object.entries(d.topics_by_status).map(([k,v])=>`<span class="tag">${ST[k]||k} ${v}</span>`).join(' ')||'<span class="mute">없음</span>'}</div>`}

async function topics(){const ts=await api('GET','/api/topics');
 $('#main').innerHTML=`<div class="card"><div class="row"><input type="text" id="kw" placeholder="키워드 (예: 제주도 3박4일 여행 코스)"><input type="text" id="cat" placeholder="카테고리" style="max-width:140px"><input type="text" id="grp" placeholder="그룹" style="max-width:120px"></div>
 <div class="row"><input type="text" id="memo" placeholder="메모 (글에 반드시 반영할 사실·근거)"><button class="b" onclick="addTopic()">등록</button></div></div>
 <div class="card"><table><tr><th>#</th><th>키워드</th><th>그룹/카테고리</th><th>상태</th><th></th></tr>${ts.map(t=>`<tr><td>${t.id}</td><td>${esc(t.keyword)}<div class="mute">${esc(t.meta.notes||'')}</div></td><td>${esc(t.meta.group||'')} ${esc(t.meta.category||'')}</td><td><span class="tag">${ST[t.status]||t.status}</span>${t.last_error?`<div class="err">${esc(t.last_error)}</div>`:''}</td>
 <td>${t.status==='pending'?`<button class="b" onclick="go('wizard',${t.id})">글 작성</button>`:''}<button class="b g" onclick="editTopic(${t.id})">수정</button><button class="b g" onclick="delTopic(${t.id})">삭제</button></td></tr>`).join('')||'<tr><td class="mute">키워드를 등록하세요</td></tr>'}</table></div>`}
async function addTopic(){await act(()=>api('POST','/api/topics',{keyword:$('#kw').value,category:$('#cat').value,group:$('#grp').value,notes:$('#memo').value}),'등록됨');topics()}
async function editTopic(id){const old=(await api('GET','/api/topics')).find(x=>x.id===id).keyword;const k=prompt('키워드 수정',old);if(k){await act(()=>api('PUT','/api/topics/'+id,{keyword:k}),'수정됨');topics()}}
async function delTopic(id){if(confirm('삭제할까요?')){await act(()=>api('DELETE','/api/topics/'+id));topics()}}

async function wizard(){const id=cur;let t=(await api('GET','/api/topics')).find(x=>x.id===id),imgs=(await api('POST',`/api/topics/${id}/images`,{})).images;
 $('#main').innerHTML=`<div class="card"><h3>${esc(t.keyword)}</h3>
 <b>1. 제목</b><div class="row"><button class="b g" onclick="genTitles()">AI 제목 후보 생성</button></div><div id="titles"></div><input type="text" id="title" placeholder="직접 입력하거나 후보를 선택">
 <p><b>2. 목차</b></p><div class="row"><button class="b g" onclick="genOutline()">AI 목차 생성</button></div><textarea id="outline" style="min-height:120px" placeholder="한 줄에 소제목 하나"></textarea>
 <p><b>3. 이미지</b> <span class="mute">(본문에 넣으려면 초안 편집에서 ![설명](파일명) 사용)</span></p>
 <div id="imgs">${imgs.map(esc).join(', ')||'<span class="mute">없음</span>'}</div><input type="file" id="file" accept="image/*" onchange="upload()">
 <p><button class="b" onclick="mkDraft()">초안 생성</button></p></div>`}
async function genTitles(){const r=await act(()=>api('POST',`/api/topics/${cur}/titles`,{n:5}));if(!r)return;
 $('#titles').innerHTML=r.titles.map(x=>`<label class="opt"><input type="radio" name="t" onchange="$('#title').value=this.nextSibling.textContent"><span>${esc(x)}</span></label>`).join('')}
async function genOutline(){const r=await act(()=>api('POST',`/api/topics/${cur}/outline`,{title:$('#title').value}));if(r)$('#outline').value=r.outline.join('\n')}
function upload(){const f=$('#file').files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{
 const r=await act(()=>api('POST',`/api/topics/${cur}/upload`,{filename:f.name,data:rd.result.split(',')[1]}),'업로드됨');if(r)wizard()};rd.readAsDataURL(f)}
async function mkDraft(){toast('초안 생성 중… (수십 초 걸릴 수 있어요)');
 const r=await act(()=>api('POST',`/api/topics/${cur}/draft`,{title:$('#title').value,outline:$('#outline').value.split('\n').map(s=>s.trim().replace(/^#+\s*/,'')).filter(Boolean)}),'초안 생성됨');if(r)go('editor',r.article_id)}

async function articles(){const f=cur||'',as=await api('GET','/api/articles'+(f?'?status='+f:''));
 $('#main').innerHTML=`<div class="row">${[['','전체'],...Object.entries(ST).slice(0,5)].map(([k,v])=>`<button class="b ${k===f?'':'g'}" onclick="cur='${k}';articles()">${v}</button>`).join('')}</div>
 <div class="card"><table>${as.map(a=>`<tr><td>${a.id}</td><td><a href="#" onclick="go('editor',${a.id});return false">${esc(a.title)}</a></td><td><span class="tag">${ST[a.status]}</span></td><td class="mute">${esc(a.updated_at.replace('T',' '))}</td></tr>`).join('')||'<tr><td class="mute">글이 없습니다</td></tr>'}</table></div>`}

async function editor(){const a=await api('GET','/api/articles/'+cur),lock=a.status==='published';
 $('#main').innerHTML=`<div class="card"><div class="row"><span class="tag">${ST[a.status]}</span>${a.scheduled_at?`<span>예약: ${esc(a.scheduled_at.replace('T',' '))}</span>`:''}${a.last_error?`<span class="err">${esc(a.last_error)}</span>`:''}</div>
 <input type="text" id="t" value="${esc(a.title)}" ${lock?'disabled':''}><p></p><textarea id="b" ${lock?'disabled':''}>${esc(a.body_md)}</textarea>
 <div class="row"><input type="text" id="tg" value="${esc(a.tags.join(', '))}" placeholder="태그(쉼표 구분)" ${lock?'disabled':''}></div>
 ${a.issues.length?`<div class="card" style="border-color:var(--warn)"><b style="color:var(--warn)">검수 이슈 ${a.issues.length}건</b><ul>${a.issues.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`:(a.status==='draft'?'':'<p style="color:var(--pri)">✔ 검수 이슈 없음</p>')}
 <div class="row">${lock?'':`<button class="b" onclick="saveA()">임시저장+검수</button><button class="b g" onclick="post('review')">검수만</button><button class="b g" onclick="regen()">전체 재생성</button>`}
 <button class="b g" onclick="prev()">미리보기</button><button class="b g" onclick="post('copy',true)">복사</button>
 ${['reviewed','failed','scheduled'].includes(a.status)?`<input type="datetime-local" id="at"><button class="b" onclick="doSchedule()">예약</button><button class="b r" onclick="pubNow()">지금 발행</button>`:''}
 ${a.status==='scheduled'?'<button class="b g" onclick="post(\'cancel\')">예약 취소</button>':''}</div>
 <div id="pv"></div></div>`}
const body=()=>({title:$('#t').value,body_md:$('#b').value,tags:$('#tg').value});
async function saveA(){const r=await act(()=>api('PUT','/api/articles/'+cur,body()),'저장됨');if(r)editor()}
async function post(a,copy){const r=await act(()=>api('POST',`/api/articles/${cur}/${a}`,{}),'완료');if(r){copy?go('editor',r.id):editor()}}
async function regen(){if(!confirm('본문을 새로 생성합니다. 편집 내용은 사라져요.'))return;toast('재생성 중…');const r=await act(()=>api('POST',`/api/articles/${cur}/regenerate`,{}),'재생성됨');if(r)editor()}
async function doSchedule(){const v=$('#at').value;if(!v)return toast('예약 시각을 선택하세요',true);if(await act(()=>api('POST',`/api/articles/${cur}/schedule`,{at:v}),'예약됨'))editor()}
async function pubNow(){if(!confirm('네이버 블로그에 지금 발행할까요?'))return;toast('발행 중…');const r=await act(()=>api('POST',`/api/articles/${cur}/publish`,{}));if(r){toast('발행 완료: '+r.url);}editor()}
function prev(){$('#pv').innerHTML=`<iframe sandbox src="/api/articles/${cur}/preview"></iframe>`}


async function schedList(){const as=await api('GET','/api/articles?status=scheduled');as.sort((a,b)=>a.scheduled_at<b.scheduled_at?-1:1);
 $('#main').innerHTML=`<div class="card"><b>예약 발행 대기열</b><table>${as.map(a=>`<tr><td>${esc(a.scheduled_at.replace('T',' '))}</td><td><a href="#" onclick="go('editor',${a.id});return false">${esc(a.title)}</a></td><td class="err">${a.retries?`재시도 ${a.retries}`:''} ${esc(a.last_error||'')}</td></tr>`).join('')||'<tr><td class="mute">예약된 글이 없습니다</td></tr>'}</table></div>
 <div class="card mute">웹 UI 를 켜 둔 동안 예약 시각이 지난 글을 자동 발행합니다(실패 시 10분 뒤 재시도). 검수 완료된 글의 편집 화면에서 예약하세요.</div>`}
async function posts(){const ps=await api('GET','/api/posts');
 $('#main').innerHTML=`<div class="card"><div class="row"><b>발행 이력</b><a href="/api/export/posts.csv"><button class="b g">CSV 내보내기</button></a></div><table>${ps.map(p=>`<tr><td>${esc(p.published_at.replace('T',' '))}</td><td><span class="tag">${esc(p.mode)}</span></td><td>${esc(p.title)}</td><td>${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">보기</a>`:esc(p.file_path)}</td></tr>`).join('')||'<tr><td class="mute">이력이 없습니다</td></tr>'}</table></div>`}
go('dash');
</script>
</body></html>
