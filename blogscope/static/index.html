<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlogScope</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--fg:#1b2230;--mute:#6b7380;--line:#e2e6eb;--pri:#03c75a;--pri2:#e9f9f0;--bad:#d93025;--warn:#c27400;--info:#3b6fd8;
--gS:#03c75a;--gA:#2f9e6e;--gB:#3b6fd8;--gC:#c27400;--gD:#d93025}
@media(prefers-color-scheme:dark){:root{--bg:#121519;--card:#1b1f25;--fg:#e7eaf0;--mute:#9aa3b2;--line:#2b313a;--pri2:#123325;--bad:#ff6b60;--warn:#e9a23b;--info:#7aa2ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.hd{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;margin-right:10px}.logo b{color:var(--pri)}
nav button{background:none;border:0;padding:7px 11px;border-radius:7px;color:var(--mute);cursor:pointer;font:inherit}
nav button.on{background:var(--pri);color:#fff}main{max-width:1080px;margin:18px auto;padding:0 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>.grow{flex:1;min-width:200px}
input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:150px;line-height:1.7}
select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
label.f{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.sec{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:var(--bg)}
.sec textarea{background:var(--card)}.sec input{background:var(--card)}
.chk{display:inline-flex;gap:6px;align-items:center;margin:8px 14px 0 0;font-size:14px}.chk input{width:auto}
#pv{background:#fff;color:#222;border-radius:10px;padding:20px;border:1px solid var(--line)}
canvas{max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.btn{font:inherit;cursor:pointer;background:var(--pri);color:#fff;border:1px solid var(--pri);border-radius:8px;padding:9px 16px;white-space:nowrap}
.btn.g{background:var(--card);color:var(--fg);border-color:var(--line)}.btn.s{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.6;cursor:wait}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:12px}.stat .v{font-size:22px;font-weight:700}.stat .l{color:var(--mute);font-size:13px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.big{font-size:44px;font-weight:800;line-height:1}.badge{display:inline-block;padding:3px 10px;border-radius:20px;color:#fff;font-weight:700;font-size:13px}
.mute{color:var(--mute)}.small{font-size:13px}.err{color:var(--bad)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{color:var(--mute);font-weight:600;font-size:13px}td.n,th.n{text-align:right;white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri)}
.tag{display:inline-block;padding:2px 9px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:12px;margin:2px}
.ok{color:var(--pri)}.wa{color:var(--warn)}.no{color:var(--bad)}.in{color:var(--info)}
ul.tips{margin:0;padding-left:18px}ul.tips li{margin:4px 0}
a{color:var(--info)}.chart text{fill:var(--mute);font-size:10px}
.note{background:var(--pri2);border-radius:10px;padding:12px 14px;font-size:14px}
.disc{font-size:12px;color:var(--mute);margin-top:6px}
#msg{position:fixed;bottom:16px;right:16px;max-width:420px;padding:11px 15px;border-radius:9px;background:var(--fg);color:var(--bg);display:none;z-index:9}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:r 1s linear infinite;vertical-align:-2px}
@keyframes r{to{transform:rotate(1turn)}}
ol.steps{padding-left:20px;margin:6px 0}ol.steps li{margin:3px 0}
</style></head><body>
<header><div class="hd"><span class="logo">✍️ Blog<b>Scope</b></span><nav id="nav"></nav></div></header>
<main id="main"></main><div id="msg"></div>
<script>
const TABS=[['write','✍️ 글쓰기'],['docs','내 원고'],['blog','블로그 분석'],['kw','키워드 분석'],['rank','순위 확인'],['post','포스팅 진단'],['cmp','블로그 비교'],['hist','기록'],['set','설정']];
let tab='write',S={},OPT=null,W={};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'-':Number(n).toLocaleString('ko-KR');
const dt=s=>String(s||'').replace('T',' ').replace(/\+\d\d:\d\d$/,'');
const safeUrl=u=>/^https:\/\//.test(u||'')?esc(u):'#';
const ls={get(k){try{return localStorage.getItem(k)||''}catch(e){return''}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function toast(t,bad){const m=$('#msg');m.textContent=t;m.style.background=bad?'var(--bad)':'';m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',5000)}
async function api(method,url,body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});
 const j=await r.json().catch(()=>({error:'서버 응답 오류'}));if(!r.ok)throw new Error(j.error||r.status);return j}
async function run(btn,fn){const t=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span> 분석 중';try{return await fn()}catch(e){toast(e.message,true)}finally{btn.disabled=false;btn.innerHTML=t}}
function nav(){$('#nav').innerHTML=TABS.map(([k,v])=>`<button class="${k===tab?'on':''}" data-t="${k}">${v}</button>`).join('');
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.t))}
function go(t,arg){tab=t;nav();({write:pWrite,docs:pDocs,blog:pBlog,kw:pKw,rank:pRank,post:pPost,cmp:pCmp,hist:pHist,set:pSet})[t](arg)}
const gcol=g=>`var(--g${g in{S:1,A:1,B:1,C:1,D:1}?g:'D'})`;
const badge=(g,n)=>`<span class="badge" style="background:${gcol(g)}">${esc(g)} · ${esc(n)}</span>`;
const stat=(v,l)=>`<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`;
const keyNeeded=what=>S.has_search?'':`<div class="note">🔑 ${what} 설정 탭에서 <b>무료 네이버 API 키</b>를 넣으면 더 정확해집니다. <a href="#" onclick="go('set');return false">설정하러 가기</a></div>`;

function bars(data,h=140){if(!data||!data.length)return'<p class="mute small">데이터 없음</p>';const max=Math.max(1,...data.map(d=>d.value)),w=Math.max(18,Math.min(70,Math.floor(640/data.length)));
 const W=w*data.length;return `<svg class="chart" viewBox="0 0 ${W} ${h+28}" style="width:100%;max-width:${W}px;max-height:${h+40}px">${data.map((d,i)=>{const bh=d.value/max*h;
 return `<rect x="${i*w+3}" y="${h-bh+12}" width="${w-6}" height="${bh}" rx="3" fill="var(--pri)" opacity=".85"><title>${esc(d.label)}: ${d.value}</title></rect>
 ${d.value?`<text x="${i*w+w/2}" y="${h-bh+9}" text-anchor="middle">${d.value}</text>`:''}<text x="${i*w+w/2}" y="${h+25}" text-anchor="middle">${esc(d.label)}</text>`}).join('')}</svg>`}
function line(data,h=140,key='value',lab='label'){if(!data||data.length<2)return'<p class="mute small">2회 이상 측정하면 추이가 표시됩니다.</p>';
 const vals=data.map(d=>d[key]??0),max=Math.max(...vals),min=Math.min(...vals),W=640,step=W/(data.length-1),y=v=>12+(max===min?h/2:(1-(v-min)/(max-min))*h);
 const pts=vals.map((v,i)=>`${i*step},${y(v)}`).join(' ');const every=Math.ceil(data.length/8);
 return `<svg class="chart" viewBox="-10 0 ${W+20} ${h+30}" width="100%" style="max-height:${h+40}px"><polyline points="${pts}" fill="none" stroke="var(--pri)" stroke-width="2.5"/>
 ${vals.map((v,i)=>`<circle cx="${i*step}" cy="${y(v)}" r="3" fill="var(--pri)"><title>${esc(data[i][lab])}: ${v}</title></circle>`).join('')}
 ${data.map((d,i)=>i%every===0||i===data.length-1?`<text x="${i*step}" y="${h+26}" text-anchor="middle">${esc(String(d[lab]).slice(2,10))}</text>`:'').join('')}</svg>`}


/* ---------------- 글쓰기 ---------------- */
const sel=(id,obj,v)=>`<select id="${id}">${Object.entries(obj).map(([k,n])=>`<option value="${k}" ${k===v?'selected':''}>${esc(n)}</option>`).join('')}</select>`;
function pWrite(){if(!OPT){$('#main').innerHTML='<div class="card">불러오는 중…</div>';api('GET','/api/writer/options').then(o=>{OPT=o;pWrite()}).catch(e=>toast(e.message,true));return}
 const i=W.inp||{};
 $('#main').innerHTML=`${S.has_llm?'':`<div class="note" style="margin-bottom:14px">🔑 글쓰기는 <b>무료 Gemini API 키</b>가 필요합니다. <a href="#" onclick="go('set');return false">설정에서 입력하기</a></div>`}
 <div class="card"><h2>① 글 정보</h2>
 <div class="two"><div><label class="f">핵심 키워드 *</label><input id="w_kw" placeholder="예: 임플란트 비용" value="${esc(i.keyword)}"></div>
 <div><label class="f">주제·방향 (선택)</label><input id="w_topic" placeholder="예: 60대 부모님 임플란트 고민" value="${esc(i.topic)}"></div></div>
 <div class="two"><div><label class="f">글 목적</label>${sel('w_purpose',OPT.purposes,i.purpose)}</div><div><label class="f">말투</label>${sel('w_tone',OPT.tones,i.tone)}</div>
 <div><label class="f">분량</label>${sel('w_length',OPT.lengths,i.length||'normal')}</div><div><label class="f">업종 패턴</label>${sel('w_pattern',OPT.patterns,i.pattern)}</div></div>
 <label class="f">글 스타일 (꾸밈)</label>${sel('w_style',OPT.styles,i.style||'magazine')}
 <div class="small mute" style="margin-top:4px">감성 정리형: 이모지 소제목·짧은 문단·대사 강조·“○○의 한마디” 마무리 · 내 글 스타일: 설정에 붙여넣은 내 글을 따라 씁니다${S.nickname?'':' · <a href="#" onclick="go(\'set\');return false">닉네임·고정 인사말 설정</a>'}</div>
 <div id="w_rules" class="small mute"></div>
 <label class="f">타깃 독자 (선택)</label><input id="w_aud" placeholder="예: 처음 알아보는 50~60대" value="${esc(i.audience)}">
 <label class="f">필수 포함 내용 — 가격·위치·영업시간·직접 경험 등 <span class="mute">(AI는 이 내용만 사실로 씁니다)</span></label>
 <textarea id="w_facts" style="min-height:90px" placeholder="예: 강남역 3번 출구 도보 5분 / 상담 무료 / 직접 가보니 대기 20분">${esc(i.facts)}</textarea>
 <div class="two"><div><label class="f">쓰지 말 표현 (선택)</label><input id="w_ban" value="${esc(i.banned)}"></div><div><label class="f">추가 요청 (선택)</label><input id="w_extra" placeholder="예: 비교표 느낌으로 정리" value="${esc(i.extra)}"></div></div>
 <label class="chk"><input type="checkbox" id="w_faq" ${i.faq?'checked':''}> FAQ 넣기</label>
 <label class="chk"><input type="checkbox" id="w_photo" ${i.photo_marks===false?'':'checked'}> 사진 넣을 위치 표시</label>
 <label class="chk"><input type="checkbox" id="w_refs" ${S.has_search?'checked':'disabled'}> 상위 노출 글 참고 ${S.has_search?'':'<span class="mute">(검색 API 필요)</span>'}</label>
 <p><button class="btn" id="w_plan">제목·목차 만들기</button></p></div><div id="w_out"></div>`;
 const showRules=()=>{const r=OPT.pattern_rules[$('#w_pattern').value]||[];$('#w_rules').innerHTML=r.length?'⚖️ 이 업종은 아래 표현을 피하도록 작성합니다(광고 관련 법령 주의 — 최종 검토는 직접 해주세요): '+r.map(esc).join(' · '):''};
 $('#w_pattern').onchange=showRules;showRules();
 $('#w_plan').onclick=()=>run($('#w_plan'),async()=>{W={inp:readInp()};const r=await api('POST','/api/writer/plan',{input:W.inp,use_refs:$('#w_refs').checked});
  Object.assign(W,{inp:r.input,plan:r,refs:r.refs,volume:r.volume});showPlan();if(r.notice)toast(r.notice)});
 if(W.doc)showDoc();else if(W.plan)showPlan()}
function readInp(){return{keyword:$('#w_kw').value,topic:$('#w_topic').value,purpose:$('#w_purpose').value,tone:$('#w_tone').value,length:$('#w_length').value,
 pattern:$('#w_pattern').value,style:$('#w_style').value,audience:$('#w_aud').value,facts:$('#w_facts').value,banned:$('#w_ban').value,extra:$('#w_extra').value,faq:$('#w_faq').checked,photo_marks:$('#w_photo').checked}}
function showPlan(){const p=W.plan,v=W.volume;
 $('#w_out').innerHTML=`<div class="card"><h2>② 제목·목차 고르기</h2>
 ${v?`<p class="small">📈 “${esc(v.keyword)}” 월간 검색량 <b>${fmt(v.total)}</b> (PC ${fmt(v.pc)} · 모바일 ${fmt(v.mobile)})</p>`:''}
 ${W.refs&&W.refs.length?`<details class="small"><summary>참고한 상위 노출 글 ${W.refs.length}개</summary><ol>${W.refs.map(r=>`<li><a href="${safeUrl(r.link)}" target="_blank" rel="noopener">${esc(r.title)}</a> <span class="mute">${esc(r.blogger)}</span></li>`).join('')}</ol></details>`:''}
 <label class="f">제목</label>${p.titles.map((t,k)=>`<label class="chk" style="display:flex"><input type="radio" name="w_t" value="${k}" ${k===0?'checked':''}> ${esc(t)}</label>`).join('')}
 <input id="w_title" style="margin-top:8px" value="${esc(p.titles[0])}">
 <label class="f" style="margin-top:14px">목차 <span class="mute">(소제목을 고치거나 추가·삭제·순서 변경할 수 있어요)</span></label><div id="w_ol"></div>
 <button class="btn g s" id="w_add">+ 소제목 추가</button>
 <p><button class="btn" id="w_write">본문 쓰기</button> <button class="btn g" id="w_replan">다시 기획</button></p></div>`;
 document.querySelectorAll('input[name=w_t]').forEach(r=>r.onchange=()=>$('#w_title').value=p.titles[+r.value]);
 const ol=()=>{$('#w_ol').innerHTML=p.outline.map((o,k)=>`<div class="sec"><div class="row"><b class="mute">${k+1}</b><input class="grow" data-h="${k}" value="${esc(o.heading)}">
  <button class="btn g s" data-up="${k}">↑</button><button class="btn g s" data-dn="${k}">↓</button><button class="btn g s" data-rm="${k}">삭제</button></div>
  <input class="small" data-p="${k}" style="margin-top:6px" placeholder="다룰 내용(쉼표로 구분, 선택)" value="${esc((o.points||[]).join(', '))}"></div>`).join('');
  const sync=()=>{document.querySelectorAll('[data-h]').forEach(x=>p.outline[+x.dataset.h].heading=x.value);document.querySelectorAll('[data-p]').forEach(x=>p.outline[+x.dataset.p].points=x.value.split(',').map(s=>s.trim()).filter(Boolean))};
  document.querySelectorAll('[data-h],[data-p]').forEach(x=>x.oninput=sync);
  const mv=(k,d)=>{sync();const j=k+d;if(j<0||j>=p.outline.length)return;[p.outline[k],p.outline[j]]=[p.outline[j],p.outline[k]];ol()};
  document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>mv(+b.dataset.up,-1));document.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>mv(+b.dataset.dn,1));
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{sync();p.outline.splice(+b.dataset.rm,1);ol()})};
 ol();$('#w_add').onclick=()=>{p.outline.push({heading:'',points:[]});ol()};
 $('#w_replan').onclick=()=>$('#w_plan').click();
 $('#w_write').onclick=()=>run($('#w_write'),async()=>{toast('본문을 쓰는 중입니다. 30초~1분 정도 걸릴 수 있어요.');
  const r=await api('POST','/api/writer/write',{input:W.inp,title:$('#w_title').value,outline:p.outline.filter(o=>o.heading.trim()),titles:p.titles,hashtags:p.hashtags,use_refs:$('#w_refs')?$('#w_refs').checked:true,id:W.id});
  setDoc(r);showDoc();window.scrollTo(0,$('#w_out').offsetTop-70);if(r.notice)toast(r.notice)})}
function setDoc(r){Object.assign(W,{id:r.id,inp:r.input,plan:r.plan,doc:r.doc,html:r.html,text:r.text,diag:r.diagnosis})}
function readDoc(){const d=W.doc;d.title=$('#d_title').value;d.intro=$('#d_intro').value;d.outro=$('#d_outro').value;d.outro_heading=$('#d_oh')?$('#d_oh').value:'';
 d.sections.forEach((s,k)=>{s.heading=$('#d_h'+k).value;s.content=$('#d_c'+k).value});(d.faq||[]).forEach((f,k)=>{f.q=$('#d_q'+k).value;f.a=$('#d_a'+k).value});
 d.hashtags=$('#d_tags').value.split(/[\s,#]+/).filter(Boolean);return d}
const ta=(id,v,h)=>`<textarea id="${id}" style="min-height:${h||160}px">${esc(v)}</textarea>`;
function showDoc(){const d=W.doc,g=W.diag;
 $('#w_out').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">③ 원고 <span class="mute small">#${W.id}</span></h2>
 <div class="row"><button class="btn" id="d_copy">📋 네이버에 붙여넣기용 복사</button><button class="btn g" id="d_txt">텍스트 복사</button><button class="btn g" id="d_save">저장·재진단</button><button class="btn g" id="d_pv">미리보기</button><button class="btn g" id="d_thumb">🖼 썸네일</button><button class="btn g" id="d_img">🎨 이미지</button></div></div>
 <p class="small mute">복사 후 네이버 블로그 글쓰기 본문에 붙여넣으세요. 제목은 에디터 제목칸에 따로 입력합니다. <b>[사진: …]</b> 자리에 직접 찍은 사진을 넣고, <b>[확인 필요: …]</b> 는 꼭 사실을 확인해 고쳐주세요.</p>
 <div id="d_pvbox"></div><div id="d_thumbbox"></div><div id="d_imgbox"></div>
 <label class="f">제목</label><input id="d_title" value="${esc(d.title)}">
 <div class="sec"><div class="row" style="justify-content:space-between"><b>도입부</b><button class="btn g s" data-rw="intro">다시 쓰기</button></div>${ta('d_intro',d.intro,130)}</div>
 ${d.sections.map((s,k)=>`<div class="sec"><div class="row"><input class="grow" id="d_h${k}" value="${esc(s.heading)}" style="font-weight:700"><button class="btn g s" data-rw="${k}">다시 쓰기</button></div>${ta('d_c'+k,s.content)}</div>`).join('')}
 ${(d.faq||[]).length?`<div class="sec"><b>FAQ</b>${d.faq.map((f,k)=>`<input id="d_q${k}" style="margin-top:8px;font-weight:700" value="${esc(f.q)}">${ta('d_a'+k,f.a,70)}`).join('')}</div>`:''}
 <div class="sec"><div class="row" style="justify-content:space-between"><b>마무리</b><button class="btn g s" data-rw="outro">다시 쓰기</button></div>

async function copyHtml(h,t){try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([h],{type:'text/html'}),'text/plain':new Blob([t],{type:'text/plain'})})])}
 catch(e){const d=document.createElement('div');d.contentEditable='true';d.innerHTML=h;d.style.position='fixed';d.style.left='-9999px';document.body.appendChild(d);
  const r=document.createRange();r.selectNodeContents(d);const s=getSelection();s.removeAllRanges();s.addRange(r);const ok=document.execCommand('copy');s.removeAllRanges();d.remove();if(!ok)throw new Error('복사에 실패했습니다. 미리보기에서 직접 드래그해 복사하세요.')}}
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}}

// [배경, 큰 글씨, 강조색, 강조 글씨]
const THEMES=[['#03c75a','#ffffff','#ffffff','#03a64b'],['#1f2937','#ffffff','#fbbf24','#1f2937'],['#fff4e6','#3b2a1a','#f97316','#ffffff'],['#eef2ff','#1e1b4b','#6366f1','#ffffff'],['#ffffff','#111111','#ef4444','#ffffff']];
function thumb(title,kw){$('#d_thumbbox').innerHTML=`<div class="sec"><div class="row" style="justify-content:space-between"><b>썸네일 만들기 (1080×1080)</b><button class="btn g s" onclick="$('#d_thumbbox').innerHTML=''">닫기</button></div>
 <div class="two"><div><label class="f">큰 글씨</label><input id="t_main" value="${esc(title)}"></div><div><label class="f">작은 글씨</label><input id="t_sub" value="${esc(kw)}"></div></div>
 <div class="row" style="margin:10px 0">${THEMES.map((t,k)=>`<button class="btn g s" data-th="${k}" style="background:${t[0]};color:${t[1]};border-color:${t[2]}">테마 ${k+1}</button>`).join('')}</div>
 <canvas id="t_cv" width="1080" height="1080" style="width:360px"></canvas><p><button class="btn" id="t_dl">PNG 저장</button></p></div>`;
 let th=0;const draw=()=>drawThumb($('#t_cv'),$('#t_main').value,$('#t_sub').value,THEMES[th]);
 document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{th=+b.dataset.th;draw()});$('#t_main').oninput=draw;$('#t_sub').oninput=draw;draw();
 $('#t_dl').onclick=()=>$('#t_cv').toBlob(bl=>{const a=document.createElement('a'),u=URL.createObjectURL(bl);a.href=u;
  a.download='thumbnail-'+new Date().toISOString().slice(0,19).replace(/\D/g,'')+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)},'image/png')}
function wrapLines(ctx,text,maxW){const out=[];let line='';for(const ch of text){if(ctx.measureText(line+ch).width>maxW&&line){out.push(line);line=ch.trim()?ch:''}else line+=ch}if(line)out.push(line);return out}
function drawThumb(cv,main,sub,[bg,fg,ac,pt]){const c=cv.getContext('2d'),W=1080,F='"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
 c.fillStyle=bg;c.fillRect(0,0,W,W);c.fillStyle=ac;c.fillRect(0,0,W,24);c.fillRect(0,W-24,W,24);
 let size=110,lines;do{c.font=`800 ${size}px ${F}`;lines=wrapLines(c,main||'',W-160);size-=6}while(lines.length*size*1.3>620&&size>48);size+=6;
 const lh=size*1.3,top=(W-lines.length*lh)/2+size*0.35;c.fillStyle=fg;c.textAlign='center';c.textBaseline='middle';
 lines.forEach((l,k)=>c.fillText(l,W/2,top+k*lh));
 if(sub){c.font=`700 46px ${F}`;const tw=c.measureText(sub).width+60,y=top-lh/2-90;c.fillStyle=ac;c.beginPath();c.roundRect?c.roundRect(W/2-tw/2,y-38,tw,76,38):c.rect(W/2-tw/2,y-38,tw,76);c.fill();
  c.fillStyle=pt;c.fillText(sub,W/2,y+2)}}

 ${r.trend.length?`<div class="card"><h3>최근 1년 검색 추이 <span class="mute small">(네이버 데이터랩, 기간 내 최대값=100)</span></h3>${line(r.trend,120,'ratio','period')}</div>`:''}
 ${r.related.length?`<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">연관 키워드 ${r.related.length}개</h3><button class="btn g s" onclick="csv()">CSV 저장</button></div>
 <table><tr><th>키워드</th><th class="n">PC</th><th class="n">모바일</th><th class="n">합계</th><th>경쟁도</th><th></th></tr>${r.related.map((k,i)=>`<tr><td>${esc(k.keyword)}</td><td class="n">${fmt(k.pc)}</td><td class="n">${fmt(k.mobile)}</td><td class="n"><b>${fmt(k.total)}</b></td><td>${esc(k.comp)}</td><td class="n"><button class="btn g s" data-i="${i}">분석</button></td></tr>`).join('')}</table></div>`:''}
 ${r.top_posts.length?`<div class="card"><h3>상위 노출 글 (블로그 검색 정확도순)</h3><table>${r.top_posts.map(p=>`<tr><td class="n" style="width:36px">${p.rank}</td><td><a href="${safeUrl(p.link)}" target="_blank" rel="noopener">${esc(p.title)}</a><div class="mute small">${esc(p.blogger)}</div></td><td class="mute small n">${esc(p.date.replace(/(\d{4})(\d\d)(\d\d)/,'$1-$2-$3'))}</td></tr>`).join('')}</table></div>`:''}`;
 document.querySelectorAll('#out button[data-i]').forEach(b=>b.onclick=()=>{$('#kw').value=r.related[+b.dataset.i].keyword;window.scrollTo(0,0);$('#go').click()})}
function csv(){const rows=[['키워드','PC','모바일','합계','경쟁도'],...(window._rel||[]).map(k=>[k.keyword,k.pc,k.mobile,k.total,k.comp])];
 const q=v=>{v=String(v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
 const blob=new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='연관키워드.csv';a.click()}

 <p><button class="btn" id="go">순위 확인</button></p></div>${keyNeeded('순위 확인은 검색 API 키가 있어야 합니다.')}<div id="out"></div>`;

  <td class="n">${x.rank?`<b class="${x.rank<=10?'ok':'wa'}">${x.rank}위</b>`:'<span class="mute">100위 밖</span>'}</td><td>${x.link?`<a href="${safeUrl(x.link)}" target="_blank" rel="noopener">${esc(x.title)}</a>`:''}</td><td class="n mute">${fmt(x.total)}</td></tr>`).join('')}</table>
  <p class="disc">네이버 검색 API(블로그, 정확도순) 기준입니다. 실제 검색 화면(통합검색·스마트블록)과는 다를 수 있습니다.</p></div>`})}

/* ---------------- 포스팅 진단 ---------------- */
function pPost(){$('#main').innerHTML=`<div class="card"><h2>포스팅 진단</h2><p class="mute small">글 주소를 넣거나 제목·본문을 붙여넣으면 분량·키워드·가독성·중복·광고성 표현을 점검합니다. 발행 전 초안도 진단할 수 있어요.</p>
 <div class="row"><input class="grow" id="url" placeholder="글 주소 (예: https://blog.naver.com/아이디/224410368545)"><input id="pkw" placeholder="목표 키워드(선택)" style="max-width:220px"></div>
 <p class="mute small">또는 직접 붙여넣기 (주소를 비워두세요)</p><input id="pt" placeholder="제목"><p></p><textarea id="pb" placeholder="본문"></textarea>
 <p><button class="btn" id="go">진단</button></p></div><div id="out"></div>`;
 $('#go').onclick=()=>run($('#go'),async()=>{const u=$('#url').value.trim();
  const r=await api('POST','/api/post',u?{url:u,keyword:$('#pkw').value}:{title:$('#pt').value,text:$('#pb').value,keyword:$('#pkw').value});
  const ic={good:'<b class="ok">✔</b>',warn:'<b class="wa">▲</b>',bad:'<b class="no">✖</b>',info:'<b class="in">ⓘ</b>'},st=r.stats;
  $('#out').innerHTML=`<div class="card"><div class="score"><div><div class="big" style="color:${gcol(r.grade)}">${r.score}</div><div class="mute small">/ 100</div></div>
  <div class="grow"><h2 style="margin:0">${esc(r.title||'(제목 없음)')}</h2><div style="margin-top:6px">${badge(r.grade,r.name)} <span class="tag">${r.source==='url'?'주소에서 가져옴':'붙여넣기'}</span></div></div></div>
  <table style="margin-top:12px">${r.checks.map(c=>`<tr><td style="width:28px">${ic[c.status]}</td><td style="width:140px"><b>${esc(c.name)}</b></td><td>${esc(c.msg)}</td></tr>`).join('')}</table><p class="disc">ⓘ ${esc(r.disclaimer)}</p></div>
  <div class="card"><div class="grid">${stat(fmt(st.chars),'글자 수(공백 제외)')}${stat(fmt(st.chars_with_spaces),'글자 수(공백 포함)')}${stat(fmt(st.paragraphs),'문단')}${stat(fmt(st.sentences),'문장')}${stat(st.images==null?'-':st.images,'이미지')}${stat(fmt(st.keyword_count),'키워드 횟수')}</div></div>
  <div class="card"><h3>많이 쓴 단어</h3>${bars(st.top_words,110)}</div>`})}

function pCmp(){$('#main').innerHTML=`<div class="card"><h2>블로그 비교</h2><p class="mute small">내 블로그와 경쟁 블로그를 최대 3개까지 나란히 비교합니다.</p>
 <div class="row"><input class="grow" id="c1" placeholder="블로그 1" value="${esc(ls.get('bid'))}"><input class="grow" id="c2" placeholder="블로그 2"><input class="grow" id="c3" placeholder="블로그 3 (선택)"></div><p><button class="btn" id="go">비교</button></p></div><div id="out"></div>`;
 $('#go').onclick=()=>run($('#go'),async()=>{const r=await api('POST','/api/compare',{blogs:[$('#c1').value,$('#c2').value,$('#c3').value]});const bs=r.blogs,ok=bs.filter(b=>!b.error);
  const rowsM=[['점수',b=>`<b style="color:${gcol(b.grade)}">${b.score}</b> ${badge(b.grade,b.name)}`],['최근 7일 발행',b=>fmt(b.metrics.recent7)],['최근 30일 발행',b=>fmt(b.metrics.recent30)],['마지막 발행(일 전)',b=>b.metrics.last_post_days??'-'],['평균 발행 간격(일)',b=>b.metrics.avg_interval_days??'-']];
  const names=[...new Set(ok.flatMap(b=>b.components.map(c=>c.name)))];
  $('#out').innerHTML=`<div class="card"><table><tr><th></th>${bs.map(b=>`<th>${esc(b.title||b.blog_id)}<div class="mute small">${esc(b.blog_id)}</div></th>`).join('')}</tr>
  ${rowsM.map(([n,f])=>`<tr><td><b>${n}</b></td>${bs.map(b=>`<td>${b.error?`<span class="err small">${esc(b.error)}</span>`:f(b)}</td>`).join('')}</tr>`).join('')}
  ${names.map(n=>`<tr><td>${esc(n)}</td>${bs.map(b=>{const c=b.components&&b.components.find(x=>x.name===n);return `<td>${c?`${c.score}<div class="bar"><i style="width:${c.score}%"></i></div>`:'-'}</td>`}).join('')}</tr>`).join('')}</table></div>`})}

async function pHist(){const [b,k]=await Promise.all([api('GET','/api/history?kind=blog'),api('GET','/api/history?kind=keyword')]);
 const tb=(rows,kind)=>rows.length?`<table>${rows.map(r=>`<tr><td><a href="#" data-k="${esc(r.key)}" data-kind="${kind}">${esc(r.title||r.key)}</a> <span class="mute small">${kind==='blog'?esc(r.key):''}</span></td>
  <td class="n">${r.score==null?'-':kind==='blog'?r.score+'점':fmt(r.score)+'회'}</td><td class="mute small n">${esc(r.at.replace('T',' ').slice(0,16))} · ${r.n}회</td><td class="n"><button class="btn g s" data-del="${esc(r.key)}" data-kind="${kind}">삭제</button></td></tr>`).join('')}</table>`:'<p class="mute">기록 없음</p>';
 $('#main').innerHTML=`<div class="card"><h2>블로그 분석 기록</h2>${tb(b,'blog')}</div><div class="card"><h2>키워드 분석 기록 <span class="mute small">(숫자는 월간 검색량)</span></h2>${tb(k,'keyword')}</div>`;
 document.querySelectorAll('a[data-k]').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.kind==='blog'?'blog':'kw',a.dataset.k)});
 document.querySelectorAll('button[data-del]').forEach(x=>x.onclick=async()=>{if(!confirm('이 기록을 삭제할까요?'))return;await api('DELETE',`/api/history?kind=${x.dataset.kind}&key=${encodeURIComponent(x.dataset.del)}`);pHist()})}
