[project]
name = "blogscope"
version = "0.1.0"
description = "네이버 블로그 분석 도구 (블로그 진단·키워드 분석·순위 확인·포스팅 진단·비교)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
blogscope = "blogscope.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["blogscope"]

[tool.setuptools.package-data]
blogscope = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
