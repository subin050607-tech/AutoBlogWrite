# autoblog 설정 (config.yaml 로 복사해서 사용)

llm:
  provider: anthropic          # anthropic | mock(오프라인 테스트용)
  model: claude-sonnet-5-5
  max_tokens: 6000
  temperature: 0.8

blog:
  publisher: naver             # naver(실제 발행) | file(HTML 파일로만 저장)
  endpoint: https://api.blog.naver.com/xmlrpc
  default_category: ""         # 비워두면 카테고리 미지정
  publish: true                # false면 네이버에 '임시저장'에 가깝게 비공개 처리 시도(API 지원 범위 내)
  heading_style: plain         # bar | plain  (plain: 이모지가 들어간 소제목용)
  footer_lines:                # 글 끝에 가운데 정렬로 붙는 고정 문구
    - "💜 \"당신의 인생2막을 언제나 응원합니다.\""
    - "🌿 \"오늘도 행복한 하루 보내세요.\""
  ai_disclosure: true          # 글 하단에 "AI 도움을 받아 작성" 문구 삽입
  ai_disclosure_text: "※ 이 글은 AI의 도움을 받아 작성되었으며, 게시 전 직접 검토했습니다."

persona:
  blog_theme: "MBTI·성격심리를 쉽게 풀어주는 정보 블로그 (블로거: 해일)"
  tone: "차분하고 따뜻한 존댓말(~합니다/~할 수 있습니다/~좋겠습니다). 단정 대신 완곡한 표현"
  audience: "자기 성향이 궁금한 일반 독자, 직장인·연애 중인 사람"
  min_chars: 3000              # 공백 제외 최소 글자 수
  max_chars: 7500
  title_format: "{keyword} 특징 총정리｜성격·직업·인간관계·연애·장단점 심층분석"
  example_file: styles/example_mbti.md   # 문체 참고용 예시 글(내용은 베끼지 않음)
  extra_rules:
    - "과장·허위 정보, 확인되지 않은 수치는 쓰지 않는다"
    - "MBTI는 선호 경향일 뿐 능력·직업을 정하는 검사가 아님을 본문 중 최소 한 번 분명히 쓴다"
  style_guide:
    - "도입부는 일상 속 짧은 상황극으로 시작한다. 인물이 말하는 대사는 “큰따옴표” 한 줄을 단독 문단으로 둔다"
    - "도입 첫 줄 위에 '이모지 + “핵심 문구” + 유형 별칭' 형태의 한 줄 부제를 넣는다"
    - "한 문단은 1~2문장으로 짧게 끊고, 문단 사이는 항상 빈 줄을 둔다"
    - "소제목(##)은 '이모지 + 독자에게 묻는 문장 또는 명사구'로 쓴다. 예: ## 🧭 ISTJ의 네 글자는 무엇을 의미할까요?"
    - "소제목 아래 세부 항목은 ### 이모지 소제목(예: ### 📌 …)을 쓴다. 목록 항목은 '🌱 내용' 처럼 이모지로 시작하는 줄로 쓴다"
    - "‘강점이 지나치면’ 같은 대비는 '이모지 키워드 → 한 줄 결과' 쌍으로 쓴다"
    - "'~일 수 있습니다', '~하는 경향이 있습니다'처럼 단정을 피하고, 고정관념·일반화를 경계하는 문단을 포함한다"
    - "본문 구성: 부제 → 상황극 도입 → 네 글자 의미 → 특징 → 직업·업무환경 → 인간관계 → 연애 → 강점이 지나칠 때 → 스트레스 → 성장 포인트 → 사람마다 다르다는 점 → 자기 점검 질문 → '🌿 해일의 심리 한마디' 마무리"
    - "자기 점검 질문은 ①②③… 번호로 8~9개, 마지막에 '검사가 아니라 자기이해 질문'이라는 단서를 쓴다"
    - "마무리 문단은 따뜻한 메시지로 끝내고 마지막 문장 끝에 🌿 를 붙인다"
    - "'함께 읽으면 좋은 글' 섹션과 링크는 사용자가 메모로 준 경우에만 쓴다(URL을 지어내지 않는다)"
    - "태그는 10개: 유형명, 유형명+특징/성격/직업/연애/인간관계, MBTI, MBTI성격유형, 성격심리, 자기이해"

quality:
  require_keyword_in_title: true
  max_keyword_density: 0.10    # 본문 대비 키워드 비율 상한. MBTI 글은 유형명이 자주 나와 높게 둠(일반 글은 0.04 권장)
  min_headings: 2
  title_similarity_limit: 0.8  # 기존 제목과 이 이상 비슷하면 중복으로 간주
  banned_words: []             # 포함되면 재생성
  max_regenerations: 2

schedule:
  active_hours: [9, 22]        # 이 시간대(시)에만 발행
  daily_limit: 2               # 하루 최대 발행 수
  min_interval_minutes: 180    # 발행 간 최소 간격
  jitter_minutes: 40           # 간격에 ± 랜덤 편차 (기계적 패턴 방지)
  poll_seconds: 60

paths:
  db: data/autoblog.db
  output: output
  images: images               # 주제별 이미지 폴더 기본 위치
